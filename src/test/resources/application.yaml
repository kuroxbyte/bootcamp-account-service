# Configuración de las pruebas: no se consulta config-server.
spring:
  config:
    # Toma la configuración común (circuit breaker y timeout) de config-repo.
    import: optional:file:../config-repo/application.yaml
  application:
    name: account-service
  cloud:
    config:
      enabled: false
  mongodb:
    uri: mongodb://localhost:27017/account_test_db

clients:
  customer-service:
    base-url: http://customer-service
    timeout: 3s
  credit-service:
    base-url: http://credit-service

accounts:
  vip-savings:
    minimum-daily-average: 500
  transaction-fee:
    savings:
      free-monthly-transactions: 4
      amount: 1.00
    checking:
      free-monthly-transactions: 3
      amount: 2.00
    fixed-term:
      free-monthly-transactions: 1
      amount: 5.00

eureka:
  client:
    # Las pruebas no se registran en Eureka.
    enabled: false
